# Builds the Jekyll site and publishes it to GitHub Pages.
# Runs on every push to main (and manually from the Actions tab).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time. A deployment that is already running is
# allowed to finish; newer pushes wait for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3" # latest 3.3.x; never pin a patch version here
          bundler-cache: true # caches gems between runs

      - name: Setup Python (nbconvert for notebook posts)
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ImageMagick and nbconvert
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          pip3 install -q -r requirements.txt

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
